<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>课堂集体任务看板</title>
    <style>
        :root {
            --bg-color: #FAF6EE;
            --border-color: #5A3E2D;
            --text-main: #3C281E;
            --accent-yellow: #F5B041;
            --accent-orange: #EB984E;
            --accent-green: #52BE80;
            --accent-purple: #AF7AC5;
            --accent-blue: #4A90E2;
            --accent-red: #EC7063;
        }

        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg-color);
            color: var(--text-main);
            margin: 0; padding: 20px;
            display: flex; flex-direction: column; align-items: center;
            user-select: none;
        }

        .task-header {
            width: 100%; max-width: 900px; background: white;
            border: 3.5px solid var(--border-color); border-radius: 20px;
            padding: 15px 25px; display: flex; justify-content: space-between;
            align-items: center; box-shadow: 0 6px 0 var(--border-color);
            margin-bottom: 30px; box-sizing: border-box;
        }

        /* 任务抽奖主舞台容器 */
        .task-stage-container {
            width: 100%; max-width: 900px; background: white;
            border: 4px solid var(--border-color); border-radius: 28px;
            padding: 40px 30px; box-shadow: 0 8px 0 var(--border-color);
            display: flex; flex-direction: column; align-items: center;
            box-sizing: border-box; text-align: center; min-height: 420px;
            justify-content: center; position: relative;
        }

        /* 初始抽取按钮区 */
        #drawSection {
            display: flex; flex-direction: column; align-items: center; gap: 20px;
        }

        .btn-draw {
            padding: 16px 40px; font-size: 22px; font-weight: 900; color: white;
            background: var(--accent-red); border: 4px solid var(--border-color);
            border-radius: 24px; box-shadow: 0 6px 0 var(--border-color); cursor: pointer;
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .btn-draw:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--border-color); }

        /* 抽中后的任务展示卡片 */
        #activeTaskSection {
            display: none; flex-direction: column; align-items: center; width: 100%; max-width: 550px;
            animation: cardPop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .active-task-card {
            width: 100%; background: #FFFDF9; border: 4px solid var(--border-color);
            border-radius: 24px; padding: 30px; box-shadow: 0 8px 0 var(--border-color);
            display: flex; flex-direction: column; align-items: center; gap: 15px; box-sizing: border-box;
            margin-bottom: 25px;
        }

        .active-icon { font-size: 70px; }
        .active-title { font-size: 24px; font-weight: 900; color: var(--text-main); }
        .active-reward {
            font-size: 15px; font-weight: bold; color: var(--accent-orange);
            background: white; border: 2.5px solid var(--border-color);
            padding: 4px 14px; border-radius: 12px;
        }

        .action-btn-row {
            display: flex; gap: 15px; width: 100%; justify-content: center; flex-wrap: wrap;
        }

        .btn-action {
            padding: 12px 24px; font-size: 16px; font-weight: 900; color: white;
            border: 3px solid var(--border-color); border-radius: 18px;
            box-shadow: 0 4px 0 var(--border-color); cursor: pointer; transition: transform 0.1s;
        }
        .btn-action:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--border-color); }
        .btn-confirm { background: var(--accent-green); flex: 1; }
        .btn-re-draw { background: var(--accent-blue); }

        /* 庆祝全屏遮罩与金币雨特效 */
        .celebration-overlay {
            display: none; position: fixed; top: 0; left: 0;
            width: 100vw; height: 100vh; background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(5px); z-index: 99999; flex-direction: column;
            align-items: center; justify-content: center; cursor: pointer;
            overflow: hidden;
        }

        .celebration-card {
            width: 360px; background: #FFFDF9; border: 5px solid var(--border-color);
            border-radius: 32px; padding: 30px; text-align: center;
            box-shadow: 0 12px 0 var(--border-color), 0 0 60px #F5B041;
            animation: cardPop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            z-index: 10; position: relative;
        }
        @keyframes cardPop {
            0% { transform: scale(0.3); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .bounce { animation: bounce 2s infinite; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }

        /* 金币雨粒子动画 */
        .coin-particle {
            position: absolute; font-size: 26px; animation: fall linear forwards; z-index: 5; pointer-events: none;
        }
        @keyframes fall {
            0% { transform: translateY(-50px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(105vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="task-header">
        <div style="font-size: 20px; font-weight: bold;">📋 课堂随机集体任务</div>
        <div style="font-size: 14px; font-weight: bold; color: #7F8C8D;" id="classNameIndicator">当前班级: 加载中...</div>
    </div>

    <!-- 任务主舞台 -->
    <div class="task-stage-container">
        
        <!-- 初始抽取按键区 -->
        <div id="drawSection">
            <div style="font-size: 18px; font-weight: bold; color: #7F8C8D; margin-bottom: 10px;">点击下方按钮，随机抽取今日全班集体挑战任务！</div>
            <button class="btn-draw" onclick="drawRandomTask()">🎲 随机抽取任务</button>
        </div>

        <!-- 抽中后的任务展示区 -->
        <div id="activeTaskSection">
            <div style="font-size: 15px; font-weight: bold; color: var(--accent-orange); margin-bottom: 8px;">🎯 今日抽中的集体任务：</div>
            <div class="active-task-card">
                <div class="active-icon" id="activeIcon">🗣️</div>
                <div class="active-title" id="activeTitle">任务名称</div>
                <div class="active-reward" id="activeReward">🎁 全班每人 +50 积分 & +50 EXP</div>
            </div>

            <div class="action-btn-row">
                <button class="btn-action btn-re-draw" onclick="drawRandomTask()">🔄 换一个</button>
                <button class="btn-action btn-confirm" onclick="completeActiveTask()">🏆 确认全班已达成并领奖</button>
            </div>
        </div>

    </div>

    <!-- 庆祝成功全屏弹窗 -->
    <div class="celebration-overlay" id="celebrationModal" onclick="closeCelebrationModal()">
        <div class="celebration-card">
            <div style="font-size: 70px;" class="bounce">🎉</div>
            <div style="font-size: 24px; font-weight: 900; color: var(--text-main); margin-top: 10px;" id="celebTitle">全班任务达成！</div>
            <div style="font-size: 14px; font-weight: bold; color: #7F8C8D; margin: 12px 0 20px 0; line-height: 1.5;" id="celebDesc">全班齐心协力，奖励已发放！</div>
            <div style="font-size: 12px; color: #B7950B; font-weight: bold;" id="celebTip">( 点击任意处收下全班奖励 )</div>
        </div>
    </div>

    <script>
        const TASKS = [
            { id: 1, icon: '🗣️', title: '每个人回答一道问题', rewardText: '全班每人 +50 积分 & +50 EXP', score: 50, exp: 50 },
            { id: 2, icon: '📖', title: '每人朗诵一个课文', rewardText: '全班每人 +50 积分 & +50 EXP', score: 50, exp: 50 },
            { id: 3, icon: '🤫', title: '上课时不出声', rewardText: '全班每人 +50 积分 & +50 EXP', score: 50, exp: 50 },
            { id: 4, icon: '📝', title: '今日听写一半以上', rewardText: '全班每人 +50 积分 & +50 EXP', score: 50, exp: 50 },
            { id: 5, icon: '🏃', title: '运动一下', rewardText: '全班每人 +50 积分 & +50 EXP', score: 50, exp: 50 },
            { id: 6, icon: '📋', title: '完成一页练习', rewardText: '全班每人 +50 积分 & +50 EXP', score: 50, exp: 50 },
            { id: 7, icon: '🧹', title: '桌面与文具大整顿', rewardText: '全班每人 +50 积分 & +50 EXP', score: 50, exp: 50 },
            { id: 8, icon: '🧘', title: '坐姿端正', rewardText: '全班每人 +50 积分 & +50 EXP', score: 50, exp: 50 },
            { id: 9, icon: '🙋', title: '有问题举手', rewardText: '全班每人 +50 积分 & +50 EXP', score: 50, exp: 50 },
            { id: 10, icon: '✨', title: '桌面整洁', rewardText: '全班每人 +50 积分 & +50 EXP', score: 50, exp: 50 }
        ];

        let db = null;
        let currentDrawnTask = null;

        function loadData() {
            const saved = localStorage.getItem('classroom_multi_accounts_v1');
            if (saved) {
                try { db = JSON.parse(saved); } catch(e) {}
            }
            updateHeaderInfo();
        }

        function updateHeaderInfo() {
            const indicator = document.getElementById('classNameIndicator');
            if (!db || !db.classesList || !db.currentClass) {
                indicator.innerText = '当前班级: 默认班级';
                return;
            }
            const currentCls = db.classesList.find(c => c.id === db.currentClass);
            indicator.innerText = `当前班级: ${currentCls ? currentCls.name : '未知班级'} (${(db[db.currentClass] || []).length}名学生)`;
        }

        function drawRandomTask() {
            loadData();
            if (!db || !db.currentClass || !db[db.currentClass] || db[db.currentClass].length === 0) {
                return alert('当前班级还没有学生，请先在主页添加学生！');
            }

            // 随机抽取一个任务
            const randomIndex = Math.floor(Math.random() * TASKS.length);
            currentDrawnTask = TASKS[randomIndex];

            // 渲染到展示区
            document.getElementById('activeIcon').innerText = currentDrawnTask.icon;
            document.getElementById('activeTitle').innerText = currentDrawnTask.title;
            document.getElementById('activeReward').innerText = `🎁 ${currentDrawnTask.rewardText}`;

            // 切换视图
            document.getElementById('drawSection').style.display = 'none';
            document.getElementById('activeTaskSection').style.display = 'flex';
        }

        function completeActiveTask() {
            if (!currentDrawnTask) return;
            loadData();

            const currentStudents = db[db.currentClass];
            if (!currentStudents || currentStudents.length === 0) {
                return alert('当前班级没有学生！');
            }

            // 批量给当前班级的所有学生发放奖励
            currentStudents.forEach(student => {
                student.score += currentDrawnTask.score;
                student.exp = (student.exp || 0) + currentDrawnTask.exp;
            });

            // 保存回 localStorage
            localStorage.setItem('classroom_multi_accounts_v1', JSON.stringify(db));

            // 触发全屏庆祝与金币雨
            showCelebration(currentDrawnTask);
        }

        function showCelebration(task) {
            const modal = document.getElementById('celebrationModal');
            document.getElementById('celebTitle').innerText = `🎉 【${task.title}】达成！`;
            document.getElementById('celebDesc').innerText = `全班齐心协力，全员成功领取奖励：\n💰 +${task.score} 积分 | ⭐ +${task.exp} EXP！`;
            
            modal.style.display = 'flex';
            createCoinRain();
        }

        function createCoinRain() {
            const modal = document.getElementById('celebrationModal');
            document.querySelectorAll('.coin-particle').forEach(p => p.remove());

            const icons = ['💰', '🪙', '✨', '⭐', '🎁', '🎉'];
            for (let i = 0; i < 45; i++) {
                const particle = document.createElement('div');
                particle.className = 'coin-particle';
                particle.innerText = icons[Math.floor(Math.random() * icons.length)];
                particle.style.left = Math.random() * 100 + 'vw';
                particle.style.animationDuration = (Math.random() * 1.5 + 1) + 's';
                particle.style.animationDelay = (Math.random() * 0.5) + 's';
                modal.appendChild(particle);
            }
        }

        function closeCelebrationModal() {
            document.getElementById('celebrationModal').style.display = 'none';
            document.querySelectorAll('.coin-particle').forEach(p => p.remove());
            
            // 重置回初始抽取状态
            document.getElementById('activeTaskSection').style.display = 'none';
            document.getElementById('drawSection').style.display = 'flex';
            currentDrawnTask = null;
            loadData();
        }

        window.onload = loadData;
    </script>
</body>
</html>
